name: Plan

# Plans the day well before the first post so a failure leaves hours of repair
# time rather than a missed slot.
on:
  schedule:
    - cron: "30 9 * * *"          # 05:30 America/New_York in summer, 04:30 in winter
  workflow_dispatch:
    inputs:
      date:
        description: "Date to plan (YYYY-MM-DD)"
        required: false

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Plan
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CI: "true"
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            python run.py plan --date "${{ inputs.date }}"
          else
            python run.py plan
          fi
          python run.py calendar --days 7
      - name: Commit plan
        run: |
          git config user.name  "sharp-autopilot"
          git config user.email "autopilot@users.noreply.github.com"
          git add data/content_history.db data/content_calendar.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "chore(autopilot): daily plan [skip ci]" && git push)
