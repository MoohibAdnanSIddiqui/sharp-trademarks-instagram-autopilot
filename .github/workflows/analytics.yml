name: Analytics

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Collect insights
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_API_HOST: ${{ vars.IG_API_HOST || 'graph.facebook.com' }}
          CI: "true"
        run: python run.py analytics
      - name: Weekly strategy review
        env:
          CI: "true"
        run: |
          if [ "$(date -u +%u)" = "1" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python run.py review
          else
            echo "Strategy review runs on Mondays. Skipping."
          fi
      - name: Commit metrics
        run: |
          git config user.name  "sharp-autopilot"
          git config user.email "autopilot@users.noreply.github.com"
          git add -A data 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "chore(autopilot): analytics [skip ci]" && git push)
